<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>场地预约系统</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { border: 1px solid #ddd; padding: .5rem; text-align: left; }
    #msg { padding: .6rem 1rem; margin: 1rem 0; border-radius: 4px; display: none; }
    #msg.ok { background: #e6f4ea; display: block; }
    #msg.err { background: #fdecea; display: block; }
  </style>
</head>
<body>
  <h1>场地预约系统</h1>
  <div id="msg"></div>

  <h2>场地列表</h2>
  <table id="venues"><thead><tr><th>编号</th><th>名称</th><th>位置</th><th>容纳人数</th><th>开放时间</th><th>状态</th></tr></thead><tbody></tbody></table>

  <!-- TODO（B）：创建预约表单 / 预约记录列表 / 取消按钮 / 新建场地表单 -->
  <h2>预约记录</h2>
  <table id="reservations"><thead><tr><th>编号</th><th>场地</th><th>预约人</th><th>日期</th><th>时间</th><th>目的</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table>

  <script>
    const API = '/api';   // 相对路径，由 nginx 反代到后端

    function show(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = ok ? 'ok' : 'err';
    }

    // 统一请求封装：失败时按契约读取 { code, message }
    async function request(path, options) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const body = await res.json().catch(() => null);
      if (!res.ok) throw new Error((body && body.message) || ('请求失败：HTTP ' + res.status));
      return body;
    }

    async function loadVenues() {
      try {
        const venues = await request('/venues');
        const tbody = document.querySelector('#venues tbody');
        tbody.innerHTML = '';
        for (const v of venues) {
          const tr = document.createElement('tr');
          [v.id, v.name, v.location, v.capacity, v.openTime + ' - ' + v.closeTime, v.status]
            .forEach(t => { const td = document.createElement('td'); td.textContent = t; tr.appendChild(td); });
          tbody.appendChild(tr);
        }
      } catch (e) { show(e.message, false); }
    }

    loadVenues();
  </script>
</body>
</html>

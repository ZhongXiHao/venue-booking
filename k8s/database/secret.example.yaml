# 占位示例。不要把填好真实密码的文件提交。
# 本文件不在 kustomization.yaml 的 resources 里，kustomize 构建结果不会包含它。
#
# 真实 Secret 名称是 database-credentials，从已忽略的 .env 创建（只取两个密码键）。
# PowerShell（仓库根目录）：
#   $pairs = @{}
#   Get-Content .env | Where-Object { $_ -match '^(MYSQL_ROOT_PASSWORD|MYSQL_PASSWORD)=' } | ForEach-Object {
#     $k, $v = $_.Split('=', 2); $pairs[$k] = $v
#   }
#   kubectl create secret generic database-credentials --namespace venue-booking `
#     --from-literal=MYSQL_ROOT_PASSWORD="$($pairs.MYSQL_ROOT_PASSWORD)" `
#     --from-literal=MYSQL_PASSWORD="$($pairs.MYSQL_PASSWORD)" `
#     --dry-run=client -o yaml | kubectl apply -f -
#
# root 只用于探针、mysqladmin shutdown 和备份。API 与报告任务使用业务账号 venue_user。
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: venue-booking
  labels:
    app: database
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change_me_root
  MYSQL_PASSWORD: change_me_user

# API 创建报告 Job 所需的最小权限：只能在 venue-booking 命名空间里创建 Job。
# 不能查看、修改、删除 Job，也不能访问 Pod、Secret 等其他资源；不使用 ClusterRole。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: venue-booking
  labels:
    app: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-job-creator
  namespace: venue-booking
  labels:
    app: api
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-report-job-creator
  namespace: venue-booking
  labels:
    app: api
subjects:
  - kind: ServiceAccount
    name: api
    namespace: venue-booking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-job-creator

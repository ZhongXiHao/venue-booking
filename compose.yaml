name: venue-booking

services:
  database:
    image: mysql:8.0
    container_name: venue-database
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 .env 中设置 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - db_data:/var/lib/mysql
      # 仅在 volume 首次初始化（数据目录为空）时执行；改了脚本需 docker compose down -v 重建
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend
    # 数据库端口不对外发布。调试需要时才临时加：ports: ["3307:3306"]，并在报告中说明

  api:
    build:
      context: ./api
    image: venue-api:1.0
    container_name: venue-api
    restart: unless-stopped
    environment:
      TZ: UTC
      DB_HOST: database          # Compose 服务名
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - frontend
    # 不发布端口：浏览器只访问 frontend，由 nginx 反代 /api

  frontend:
    build:
      context: ./frontend
    image: venue-frontend:1.0
    container_name: venue-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - frontend

volumes:
  db_data:

networks:
  # backend：api <-> database；frontend：frontend <-> api
  # 前端容器不在 backend 网络里，天然无法直连数据库
  backend:
  frontend:

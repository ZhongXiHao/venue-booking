spring:
  application:
    name: api
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      # 浮点字面量（如 1.5）不允许赋给整型字段，避免容量等字段被静默截断
      accept-float-as-int: false
server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        # 只暴露健康检查，其余 Actuator 端点不对外
        include: health
  endpoint:
    health:
      # 提供 /api/actuator/health/liveness 和 /readiness，给 Kubernetes 探针用
      probes:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true